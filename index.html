<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reliquary</title>
<meta name="description" content="One control plane to rule them all.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23a07800' stroke-width='2.5' stroke-linejoin='round'%3E%3Crect x='5' y='5' width='22' height='15' rx='1.5'/%3E%3Cpath d='M2 25h28l-2 3H4z'/%3E%3C/svg%3E">
<script>
try {
  const theme = localStorage.getItem("theme");
  if (theme) document.documentElement.dataset.theme = theme;
} catch {}
</script>
<style>
:root {
  color-scheme: light;
  --ground: #fbfaf6;
  --panel: #f2f0e9;
  --ink: #17160f;
  --muted: #6c6a5e;
  --rule: #e5e2d7;
  --accent: #a07800;
  --on-accent: #fffdf6;
  --ok: #4f7d1c;
  --sun: none;
  --moon: block;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #121110;
    --panel: #1a1917;
    --ink: #ecebe6;
    --muted: #98958b;
    --rule: #2a2825;
    --accent: #d4a72c;
    --on-accent: #121110;
    --ok: #93b84d;
    --sun: block;
    --moon: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #121110;
  --panel: #1a1917;
  --ink: #ecebe6;
  --muted: #98958b;
  --rule: #2a2825;
  --accent: #d4a72c;
  --on-accent: #121110;
  --ok: #93b84d;
  --sun: block;
  --moon: none;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 16px/1.55 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.frame {
  max-width: 46rem;
  grid-template-columns: minmax(0, 1fr);
  min-height: 100vh;
  margin-inline: auto;
  border-inline: 1px solid var(--rule);
  display: grid;
  grid-template-rows: auto auto auto 1fr;
}
.band {
  position: relative;
  border-bottom: 1px solid var(--rule);
  padding: clamp(1.25rem, 4vw, 2.5rem);
}
.band::before, .band::after {
  content: "+";
  position: absolute;
  bottom: -.62em;
  font: 14px/1 var(--mono);
  color: var(--muted);
  background: var(--ground);
}
.band::before { left: -.32em; }
.band::after { right: -.32em; }
header.band {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  padding-block: 1rem;
}
.brand {
  display: flex;
  align-items: center;
  gap: .6rem;
  font-weight: 600;
  letter-spacing: -.01em;
}
.brand svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linejoin: round;
}
.tools {
  display: flex;
  align-items: center;
  gap: 1rem;
}
.theme {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--rule);
}
.theme:hover { color: var(--ink); filter: none; }
.theme svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
}
.theme .sun { display: var(--sun); }
.theme .moon { display: var(--moon); }
.label {
  font: 12px/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 1.1rem;
  padding-block: clamp(2.5rem, 9vw, 5rem);
}
h1 {
  margin: 0;
  font: 500 clamp(1.05rem, 2.6vw, 1.35rem)/1.4 var(--mono);
  letter-spacing: -.01em;
}
h1::before { content: "# "; color: var(--accent); }
.command {
  display: flex;
  align-items: center;
  gap: .75rem;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--panel);
  padding: .5rem .5rem .5rem 1.1rem;
}
code {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  font: clamp(14px, 2.2vw, 17px)/1.5 var(--mono);
  white-space: nowrap;
  scrollbar-width: none;
}
code::before { content: "$ "; color: var(--muted); }
@media (max-width: 40rem) {
  code { white-space: normal; overflow-wrap: break-word; }
}
button {
  flex: none;
  font: 500 13px/1 var(--sans);
  color: var(--on-accent);
  background: var(--accent);
  border: 0;
  border-radius: 4px;
  padding: .6rem .9rem;
  cursor: pointer;
}
button:hover { filter: brightness(1.08); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.term {
  margin: 0;
  border: 1px dashed var(--rule);
  border-radius: 6px;
  color: var(--muted);
}
.term .bar {
  display: flex;
  justify-content: space-between;
  padding: .55rem 1rem;
  border-bottom: 1px dashed var(--rule);
}
.term pre {
  margin: 0;
  padding: .9rem 1rem;
  font: 12.5px/1.7 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: break-word;
}
.term pre > span { display: block; }
.dim { color: var(--muted); }
.dim { opacity: .7; }
.ok::first-letter { color: var(--ok); }
.cursor::after {
  content: "";
  display: inline-block;
  width: .55em;
  height: 1.1em;
  vertical-align: text-bottom;
  background: var(--accent);
}
@media (prefers-reduced-motion: no-preference) {
  .term pre > span { animation: in .3s ease-out both; }
  .term pre > span:nth-child(2) { animation-delay: .25s; }
  .term pre > span:nth-child(3) { animation-delay: .45s; }
  .term pre > span:nth-child(4) { animation-delay: .65s; }
  .term pre > span:nth-child(5) { animation-delay: .85s; }
  .term pre > span:nth-child(6) { animation-delay: 1.05s; }
  .term pre > span:nth-child(7) { animation-delay: 1.3s; }
  .term pre > span:nth-child(8) { animation-delay: 1.5s; }
  .term pre > span:nth-child(9) { animation-delay: 1.7s; }
  .term pre > span:nth-child(10) { animation-delay: 1.95s; }
  .cursor::after { animation: blink 1.1s steps(1) infinite 2.2s; }
}
@keyframes in { from { opacity: 0; transform: translateY(3px); } }
@keyframes blink { 50% { opacity: 0; } }
.hatch {
  border-bottom: 0;
  background: repeating-linear-gradient(-45deg, var(--rule) 0 1px, transparent 1px 8px);
}
.hatch::before, .hatch::after { content: none; }
</style>
<div class="frame">
  <header class="band">
    <span class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="22" height="15" rx="1.5"/><path d="M2 25h28l-2 3H4z"/></svg>
      Reliquary
    </span>
    <span class="tools">
      <span class="label">macOS · Apple silicon</span>
      <button type="button" class="theme" id="theme" aria-label="Switch light or dark">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </span>
  </header>
  <section class="band hero">
    <h1>One control plane to rule them all.</h1>
    <div class="command">
      <code id="command">curl -fsSL https://<wbr>rlqry.github.io/<wbr>ignite | bash</code>
      <button type="button" id="copy">Copy</button>
    </div>
  </section>
  <section class="band">
    <figure class="term">
      <figcaption class="bar"><span class="label">ignite</span><span class="label">sample run</span></figcaption>
      <pre><span><span class="dim">$</span> curl -fsSL https://<wbr>rlqry.github.io/<wbr>ignite | bash</span><span>Reliquary ignition</span><span class="ok">✓ custody <span class="dim">owned</span></span><span class="ok">✓ password <span class="dim">checked</span></span><span class="ok">✓ GitHub <span class="dim">approved</span></span><span class="dim">Everything asked; the rest runs unattended.</span><span class="ok">✓ Command Line Tools <span class="dim">412s</span></span><span class="ok">✓ core <span class="dim">9s</span></span><span>stage 1</span><span class="cursor"></span></pre>
    </figure>
  </section>
  <div class="band hatch"></div>
</div>
<script>
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).colorScheme === "dark";
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
});
const copy = document.getElementById("copy");
copy.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(document.getElementById("command").textContent);
    copy.textContent = "Copied";
  } catch {
    copy.textContent = "Select and copy";
  }
  setTimeout(() => { copy.textContent = "Copy"; }, 1800);
});
</script>
</html>
